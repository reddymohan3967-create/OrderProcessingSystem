<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OrderService — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/site.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">OrderService</a>
        <div class="d-flex align-items-center gap-2">
          <button id="refreshBtn" class="btn btn-outline-light me-2">Refresh Orders</button>
          <a id="loginBtn" href="/login.html" class="btn btn-outline-light">Sign in</a>
          <button id="logoutBtn" class="btn btn-outline-light d-none">Sign out</button>
          <span id="userRole" class="text-white-50 ms-2"></span>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Create Order</h5>
              <form id="orderForm">
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input id="email" type="email" class="form-control" placeholder="customer@example.com" required />
                </div>

                <div class="mb-3">
                  <label class="form-label">Product</label>
                  <div class="input-group">
                    <select id="productSelect" class="form-select">
                      <option value="Widget|9.99">Widget — $9.99</option>
                      <option value="Gizmo|14.50">Gizmo — $14.50</option>
                      <option value="Doohickey|4.50">Doohickey — $4.50</option>
                      <option value="Thingamajig|7.25">Thingamajig — $7.25</option>
                    </select>
                    <input id="qty" type="number" min="1" value="1" class="form-control" style="max-width:110px" />
                    <button id="addBtn" type="button" class="btn btn-secondary">Add</button>
                  </div>
                </div>

                <div class="mb-3">
                  <h6>Items</h6>
                  <ul id="itemsList" class="list-group"></ul>
                </div>

                <div class="d-flex align-items-center gap-2">
                  <button type="submit" class="btn btn-primary">Create Order</button>
                  <button id="clearBtn" type="button" class="btn btn-outline-secondary">Clear</button>
                  <div class="ms-auto fst-italic">Total: <span id="orderTotal">$0.00</span></div>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Orders</h5>
              <div class="mb-3 d-flex gap-2">
                <select id="filterStatus" class="form-select" style="max-width:220px">
                  <option value="">All statuses</option>
                </select>
                <input id="searchInput" class="form-control" placeholder="Search by email or product" />
              </div>

              <div id="ordersContainer" class="list-group"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site.js"></script>
  </body>
</html>
